server:
  port: 8081

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# File logs: logback-spring.xml → logs/auth/auth-service.yyyy-MM-dd.log (repo root when using bootRun)
collabflow:
  logging:
    home: ${LOG_HOME:logs}
  security:
    api-key: ${API_KEY}
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  rate-limit:
    login-max-attempts: ${AUTH_LOGIN_MAX:10}
    login-window-seconds: ${AUTH_LOGIN_WINDOW_SECONDS:60}
    register-max-attempts: ${AUTH_REGISTER_MAX:5}
    register-window-seconds: ${AUTH_REGISTER_WINDOW_SECONDS:3600}
    refresh-max-attempts: ${AUTH_REFRESH_MAX:30}
    refresh-window-seconds: ${AUTH_REFRESH_WINDOW_SECONDS:60}
    resend-verify-max-attempts: ${AUTH_RESEND_VERIFY_MAX:5}
    resend-verify-window-seconds: ${AUTH_RESEND_VERIFY_WINDOW_SECONDS:3600}
    forgot-password-max-attempts: ${AUTH_FORGOT_PASSWORD_MAX:5}
    forgot-password-window-seconds: ${AUTH_FORGOT_PASSWORD_WINDOW_SECONDS:3600}
  auth:
    public-register-enabled: ${AUTH_PUBLIC_REGISTER_ENABLED:false}
    master-admin-email: ${MASTER_ADMIN_EMAIL:admin@collabflow.local}
    master-admin-password: ${MASTER_ADMIN_PASSWORD:ChangeMeAdmin123!}
    master-admin-name: ${MASTER_ADMIN_NAME:Master Admin}
    verify-token-hours: ${AUTH_VERIFY_TOKEN_HOURS:48}
    reset-token-hours: ${AUTH_RESET_TOKEN_HOURS:2}
    public-app-base-url: ${PUBLIC_APP_BASE_URL:http://localhost:3000}
