spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:collabflow}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:root}
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.collabflow.auth: DEBUG
