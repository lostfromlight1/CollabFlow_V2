server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service
              uri: ${USER_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/users/**,/api/v1/admin/users/**
            - id: platform-service
              uri: ${PLATFORM_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/organizations/**,/api/v1/roles/**,/api/v1/workspaces/**,/api/v1/projects/**,/api/v1/platform/**,/api/v1/admin/organizations/**
            - id: task-service
              uri: ${TASK_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/tasks/**,/api/v1/workflows/**,/api/v1/task-types/**,/api/v1/sprints/**
            - id: collab-service
              uri: ${COLLAB_SERVICE_URI:http://localhost:9081}
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/collab/**,/api/v1/invitations/**,/api/v1/comments/**,/api/v1/activity/**
            - id: realtime-service
              uri: ${REALTIME_SERVICE_URI:http://localhost:9082}
              predicates:
                - Path=/api/v1/realtime/**
            - id: document-service
              uri: ${DOCUMENT_SERVICE_URI:http://localhost:9083}
              predicates:
                - Path=/api/v1/documents/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when_authorized

collabflow:
  security:
    api-key: ${API_KEY}
  jwt:
    # Must match auth-service JWT_SECRET so the gateway can verify access tokens
    secret: ${JWT_SECRET}
  cors:
    # Comma-separated origins for admin portal / app (empty = no CORS filter origins)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
