spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:collabflow}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:root}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_platform_history
    baseline-on-migrate: true
    baseline-version: "0"


logging:
  level:
    com.collabflow.platform: DEBUG
