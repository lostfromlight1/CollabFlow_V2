server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**
            - id: platform-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/organizations/**,/api/v1/roles/**,/api/v1/workspaces/**,/api/v1/projects/**,/api/v1/platform/**
            - id: task-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/tasks/**,/api/v1/workflows/**,/api/v1/task-types/**,/api/v1/sprints/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

collabflow:
  security:
    api-key: ${API_KEY:6e7f9c2b1a3d5e7f8b4fdf31e2f3a4b5c}
  jwt:
    # Must match auth-service JWT_SECRET so the gateway can verify access tokens
    secret: ${JWT_SECRET:MdSQmmDuK70dcClyAHgcdfwedfweftNYqlgPXCTeIpmJ460=}
