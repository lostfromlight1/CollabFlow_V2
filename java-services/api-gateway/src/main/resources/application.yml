server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**
            - id: platform-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/organizations/**,/api/v1/workspaces/**,/api/v1/projects/**,/api/v1/platform/**
            - id: task-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/tasks/**,/api/v1/workflows/**,/api/v1/sprints/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
