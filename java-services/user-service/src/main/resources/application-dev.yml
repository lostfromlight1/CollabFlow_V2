spring:
  datasource:
    # Same POSTGRES_* as auth/platform/task (.env via bootRun) — not SPRING_DATASOURCE_* defaults.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:collabflow}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:root}
  jpa:
    show-sql: false

logging:
  level:
    com.collabflow.user: DEBUG
